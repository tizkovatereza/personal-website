<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light dark}body{margin:0;font:16px/1.6 system-ui;color:var(--foreground);background:transparent;--foreground:light-dark(#242424,#eee);--background:light-dark(#fff,#151515);--muted:light-dark(#eeeeec,#303033);--border:light-dark(#ccc,#555);--viz-series-1:light-dark(#245caf,#86b5ff);--viz-series-2:light-dark(#a95120,#f0ac7a);--viz-series-3:light-dark(#278059,#83cea6);--blue:var(--viz-series-1);--orange:var(--viz-series-2);--green:var(--viz-series-3);--purple:light-dark(#794db2,#c4a1f5);--red:light-dark(#b84155,#ffadba)}h3{font-size:17px;font-weight:500;margin:0 0 12px}.viz-row{display:flex;flex-wrap:wrap;gap:8px}.btn{font:inherit;color:inherit;background:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:6px;cursor:pointer}.btn:focus-visible,input:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.text-small{font-size:14px}.form-label{display:block}.form-range{display:block;width:100%;margin:18px 0}.tabular-nums{font-variant-numeric:tabular-nums}svg{max-width:100%}</style><body><div id="complex-plane"><h3>A complex number is a point</h3><div class="viz-row"><button class="btn" type="button" data-a="2" data-b="3">2 + 3i</button><button class="btn" type="button" data-a="-1" data-b="2">−1 + 2i</button><button class="btn" type="button" data-a="0.5" data-b="-2">½ − 2i</button></div><svg style="width:100%;display:block" role="img" aria-label="Complex plane showing horizontal real and vertical imaginary coordinates"></svg></div>
<script>
(()=>{const root=document.getElementById('complex-plane'),svg=root.querySelector('svg'),NS='http://www.w3.org/2000/svg';let a=2,b=3;function draw(){let w=root.clientWidth,h=330,cx=w/2,cy=165,u=Math.min((w-100)/8,34);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();function el(tag,attrs,txt){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(txt)e.textContent=txt;svg.append(e);return e}for(let j=-3;j<=3;j++){el('line',{x1:cx+j*u,y1:45,x2:cx+j*u,y2:285,stroke:'var(--border)'});el('line',{x1:40,y1:cy+j*u,x2:w-20,y2:cy+j*u,stroke:'var(--border)'})}el('line',{x1:40,y1:cy,x2:w-20,y2:cy,stroke:'var(--foreground)'});el('line',{x1:cx,y1:40,x2:cx,y2:285,stroke:'var(--foreground)'});el('path',{d:`M ${cx} ${cy} H ${cx+a*u} V ${cy-b*u}`,fill:'none',stroke:'var(--viz-series-1)','stroke-width':2,'stroke-dasharray':'4 4'});el('circle',{cx:cx+a*u,cy:cy-b*u,r:6,fill:'var(--viz-series-1)'});let labels=[[w-20,cy+23,'Real part','end'],[cx,22,'Imaginary part','middle'],[cx-8,cy+18,'0','end'],[cx+a*u,cy-b*u-14,`(${a}, ${b})`,'middle']];for(let [x,y,t,anchor]of labels)el('text',{x,y,fill:'var(--foreground)','font-size':12,'text-anchor':anchor},t)}for(let btn of root.querySelectorAll('button'))btn.onclick=()=>{a=+btn.dataset.a;b=+btn.dataset.b;draw()};new ResizeObserver(draw).observe(root);draw()})();
</script>
<script>const sendHeight=()=>parent.postMessage({type:'riemann-height',height:document.body.scrollHeight},'*');new ResizeObserver(sendHeight).observe(document.body);addEventListener('load',sendHeight);</script></body></html>
