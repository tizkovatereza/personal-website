<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light dark}body{margin:0;font:16px/1.6 system-ui;color:var(--foreground);background:transparent;--foreground:light-dark(#242424,#eee);--background:light-dark(#fff,#151515);--muted:light-dark(#eeeeec,#303033);--border:light-dark(#ccc,#555);--viz-series-1:light-dark(#245caf,#86b5ff);--viz-series-2:light-dark(#a95120,#f0ac7a);--viz-series-3:light-dark(#278059,#83cea6);--blue:var(--viz-series-1);--orange:var(--viz-series-2);--green:var(--viz-series-3);--purple:light-dark(#794db2,#c4a1f5);--red:light-dark(#b84155,#ffadba)}h3{font-size:17px;font-weight:500;margin:0 0 12px}.viz-row{display:flex;flex-wrap:wrap;gap:8px}.btn{font:inherit;color:inherit;background:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:6px;cursor:pointer}.btn:focus-visible,input:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.text-small{font-size:14px}.form-label{display:block}.form-range{display:block;width:100%;margin:18px 0}.tabular-nums{font-variant-numeric:tabular-nums}svg{max-width:100%}</style><body><div id="analytic-continuation"><h3>Continuing the same function</h3><div class="viz-row"><button class="btn" type="button" data-step="0">Start at 0</button><button class="btn" type="button" data-step="1">Recenter at −0.75</button><button class="btn" type="button" data-step="2">Recenter at −1.5</button></div><svg style="width:100%;display:block" role="img" aria-label="Overlapping convergence disks extend the function one over one minus z from zero toward negative real inputs while avoiding its pole at one"></svg><div aria-live="polite" id="continuation-detail"></div></div>
<script>
(()=>{const root=document.getElementById('analytic-continuation'),svg=root.querySelector('svg'),NS='http://www.w3.org/2000/svg';let step=0;function draw(){const w=root.clientWidth,u=Math.min((w-70)/5.5,85),h=2*(1+.75*step)*u+100,X=x=>w/2+(x+1.5)*u,Y=h/2-20;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();function el(tag,a,t){let e=document.createElementNS(NS,tag);for(let k in a)e.setAttribute(k,a[k]);if(t)e.textContent=t;svg.append(e)}for(let j=0;j<=step;j++){let c=-.75*j,r=1-c;el('circle',{cx:X(c),cy:Y,r:r*u,fill:`var(--viz-series-${j+1})`,'fill-opacity':.06,stroke:`var(--viz-series-${j+1})`,'stroke-width':1.5})}el('line',{x1:30,y1:Y,x2:w-20,y2:Y,stroke:'var(--border)'});for(let [x,t]of [[-1.5,'−1.5'],[-.75,'−0.75'],[0,'0'],[1,'1']]){el('circle',{cx:X(x),cy:Y,r:4,fill:x===1?'var(--foreground)':'var(--viz-series-1)'});el('text',{x:X(x),y:Y+23,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},t)}el('text',{x:X(1),y:Y-15,fill:'var(--foreground)','font-size':12,'text-anchor':'end'},'pole');el('text',{x:w/2,y:h-15,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},'Each disk is a region where one local power series works');root.querySelector('#continuation-detail').textContent=['Original series centered at 0 works inside the first disk.','The disk centered at −0.75 agrees with the first disk and reaches past −2.','The disk centered at −1.5 reaches farther still. The pole is on the boundary of each open disk.'][step]}for(let b of root.querySelectorAll('button'))b.onclick=()=>{step=+b.dataset.step;draw()};new ResizeObserver(draw).observe(root);draw()})();
</script>
<script>const sendHeight=()=>parent.postMessage({type:'riemann-height',height:document.body.scrollHeight},'*');new ResizeObserver(sendHeight).observe(document.body);addEventListener('load',sendHeight);</script></body></html>
