<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light dark}body{margin:0;font:16px/1.6 system-ui;color:var(--foreground);background:transparent;--foreground:light-dark(#242424,#eee);--background:light-dark(#fff,#151515);--muted:light-dark(#eeeeec,#303033);--border:light-dark(#ccc,#555);--viz-series-1:light-dark(#245caf,#86b5ff);--viz-series-2:light-dark(#a95120,#f0ac7a);--viz-series-3:light-dark(#278059,#83cea6);--blue:var(--viz-series-1);--orange:var(--viz-series-2);--green:var(--viz-series-3);--purple:light-dark(#794db2,#c4a1f5);--red:light-dark(#b84155,#ffadba)}h3{font-size:17px;font-weight:500;margin:0 0 12px}.viz-row{display:flex;flex-wrap:wrap;gap:8px}.btn{font:inherit;color:inherit;background:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:6px;cursor:pointer}.btn:focus-visible,input:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.text-small{font-size:14px}.form-label{display:block}.form-range{display:block;width:100%;margin:18px 0}.tabular-nums{font-variant-numeric:tabular-nums}svg{max-width:100%}</style><body><div id="zero-symmetry"><h3>Mirror symmetry does not mean everything lies on the mirror</h3><svg style="width:100%;display:block" role="img" aria-label="Hypothetical points at real coordinates 0.3 and 0.7 reflect across the line at 0.5 while a central point remains fixed"></svg><div class="text-small">Illustrative points only. The off-line pair is hypothetical, not known zeta zeros.</div></div>
<script>
(()=>{const r=document.getElementById('zero-symmetry'),s=r.querySelector('svg'),NS='http://www.w3.org/2000/svg';function draw(){const w=r.clientWidth,L=35,R=w-35,X=x=>L+x*(R-L);s.setAttribute('viewBox',`0 0 ${w} 230`);s.replaceChildren();function el(tag,a,t){let e=document.createElementNS(NS,tag);for(let k in a)e.setAttribute(k,a[k]);if(t)e.textContent=t;s.append(e)}el('line',{x1:X(.5),y1:20,x2:X(.5),y2:180,stroke:'var(--viz-series-1)','stroke-width':2});el('line',{x1:L,y1:180,x2:R,y2:180,stroke:'var(--border)'});for(let [x,y,t]of [[.3,80,'0.3 + ti'],[.7,80,'0.7 + ti'],[.5,145,'½ + ui']]){el('circle',{cx:X(x),cy:y,r:6,fill:'var(--viz-series-1)'});el('text',{x:X(x),y:y-16,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},t)}el('line',{x1:X(.3)+8,y1:80,x2:X(.7)-8,y2:80,stroke:'var(--border)','stroke-dasharray':'4 4'});for(let x of [0,.5,1])el('text',{x:X(x),y:202,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},String(x));el('text',{x:w/2,y:225,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},'Real part')}new ResizeObserver(draw).observe(r);draw()})();
</script>
<script>const sendHeight=()=>parent.postMessage({type:'riemann-height',height:document.body.scrollHeight},'*');new ResizeObserver(sendHeight).observe(document.body);addEventListener('load',sendHeight);</script></body></html>
