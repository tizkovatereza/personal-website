<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light dark}body{margin:0;font:16px/1.6 system-ui;color:var(--foreground);background:transparent;--foreground:light-dark(#242424,#eee);--background:light-dark(#fff,#151515);--muted:light-dark(#eeeeec,#303033);--border:light-dark(#ccc,#555);--viz-series-1:light-dark(#245caf,#86b5ff);--viz-series-2:light-dark(#a95120,#f0ac7a);--viz-series-3:light-dark(#278059,#83cea6);--blue:var(--viz-series-1);--orange:var(--viz-series-2);--green:var(--viz-series-3);--purple:light-dark(#794db2,#c4a1f5);--red:light-dark(#b84155,#ffadba)}h3{font-size:17px;font-weight:500;margin:0 0 12px}.viz-row{display:flex;flex-wrap:wrap;gap:8px}.btn{font:inherit;color:inherit;background:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:6px;cursor:pointer}.btn:focus-visible,input:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.text-small{font-size:14px}.form-label{display:block}.form-range{display:block;width:100%;margin:18px 0}.tabular-nums{font-variant-numeric:tabular-nums}svg{max-width:100%}</style><body><div id="critical-line"><h3>Same horizontal coordinate, different heights</h3><svg style="width:100%;display:block" role="img" aria-label="Critical strip from zero to one with three computed zeta zeros on the central vertical line at one half"></svg><div class="text-small">Three known zeros, rounded. This finite picture does not prove the hypothesis.</div></div>
<script>
(()=>{const r=document.getElementById('critical-line'),s=r.querySelector('svg'),NS='http://www.w3.org/2000/svg';function draw(){let w=r.clientWidth,h=350,L=68,R=w-26,T=45,B=295,X=x=>L+x*(R-L),Y=y=>B-y/30*(B-T);s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.replaceChildren();function el(tag,attrs,t){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(t)e.textContent=t;s.append(e)}el('rect',{x:L,y:T,width:R-L,height:B-T,fill:'var(--muted)',opacity:.45});for(let x of [0,.5,1]){el('line',{x1:X(x),y1:T,x2:X(x),y2:B,stroke:x===.5?'var(--viz-series-1)':'var(--border)','stroke-width':x===.5?2:1});el('text',{x:X(x),y:B+22,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},String(x))}el('line',{x1:L,y1:B,x2:R,y2:B,stroke:'var(--foreground)'});for(let y of [0,10,20,30]){el('text',{x:L-12,y:Y(y)+4,fill:'var(--foreground)','font-size':12,'text-anchor':'end'},String(y))}for(let y of [14.134725,21.022040,25.010858]){el('circle',{cx:X(.5),cy:Y(y),r:5,fill:'var(--viz-series-1)'});el('text',{x:X(.5)+12,y:Y(y)+4,fill:'var(--foreground)','font-size':12},y.toFixed(2)+'i')}el('text',{x:w/2,y:23,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},'Imaginary part (height)');el('text',{x:w/2,y:h-8,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},'Real part (horizontal position)')}new ResizeObserver(draw).observe(r);draw()})();
</script>
<script>const sendHeight=()=>parent.postMessage({type:'riemann-height',height:document.body.scrollHeight},'*');new ResizeObserver(sendHeight).observe(document.body);addEventListener('load',sendHeight);</script></body></html>
