<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light dark}body{margin:0;font:16px/1.6 system-ui;color:var(--foreground);background:transparent;--foreground:light-dark(#242424,#eee);--background:light-dark(#fff,#151515);--muted:light-dark(#eeeeec,#303033);--border:light-dark(#ccc,#555);--viz-series-1:light-dark(#245caf,#86b5ff);--viz-series-2:light-dark(#a95120,#f0ac7a);--viz-series-3:light-dark(#278059,#83cea6);--blue:var(--viz-series-1);--orange:var(--viz-series-2);--green:var(--viz-series-3);--purple:light-dark(#794db2,#c4a1f5);--red:light-dark(#b84155,#ffadba)}h3{font-size:17px;font-weight:500;margin:0 0 12px}.viz-row{display:flex;flex-wrap:wrap;gap:8px}.btn{font:inherit;color:inherit;background:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:6px;cursor:pointer}.btn:focus-visible,input:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.text-small{font-size:14px}.form-label{display:block}.form-range{display:block;width:100%;margin:18px 0}.tabular-nums{font-variant-numeric:tabular-nums}svg{max-width:100%}</style><body><div id="pole-explorer"><h3>Approaching a pole: f(x) = 1 / (1 − x)</h3><label class="form-label">Input x: <span id="pole-input" class="tabular-nums"></span><input id="pole-slider" type="range" class="form-range" min="900" max="1100" value="990"></label><div id="pole-output" class="tabular-nums" aria-live="polite"></div><svg style="width:100%;display:block" role="img" aria-label="Number line with a pole at one and a selected input approaching it"></svg></div>
<script>
(()=>{const r=document.getElementById('pole-explorer'),input=r.querySelector('input'),svg=r.querySelector('svg'),NS='http://www.w3.org/2000/svg';function draw(){const w=r.clientWidth,x=+input.value/1000,pos=45+(x-.9)/.2*(w-90),mid=w/2;r.querySelector('#pole-input').textContent=x.toFixed(3);r.querySelector('#pole-output').textContent=x===1?'At x = 1: undefined. Division by zero.':`Output: ${(1/(1-x)).toLocaleString(undefined,{maximumFractionDigits:2})}`;svg.setAttribute('viewBox',`0 0 ${w} 130`);svg.replaceChildren();function el(tag,attrs,t){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(t)e.textContent=t;svg.append(e)}el('line',{x1:45,y1:50,x2:w-45,y2:50,stroke:'var(--border)','stroke-width':2});el('circle',{cx:mid,cy:50,r:10,fill:'var(--background)',stroke:'var(--foreground)','stroke-width':2});el('circle',{cx:pos,cy:50,r:5,fill:'var(--viz-series-1)'});for(let [px,t]of [[45,'0.9'],[mid,'1: pole'],[w-45,'1.1']])el('text',{x:px,y:85,fill:'var(--foreground)','font-size':12,'text-anchor':'middle'},t)}input.oninput=draw;new ResizeObserver(draw).observe(r);draw()})();
</script>
<script>const sendHeight=()=>parent.postMessage({type:'riemann-height',height:document.body.scrollHeight},'*');new ResizeObserver(sendHeight).observe(document.body);addEventListener('load',sendHeight);</script></body></html>
