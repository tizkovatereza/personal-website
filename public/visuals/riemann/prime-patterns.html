<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light dark}body{margin:0;font:16px/1.6 system-ui;color:var(--foreground);background:transparent;--foreground:light-dark(#242424,#eee);--background:light-dark(#fff,#151515);--muted:light-dark(#eeeeec,#303033);--border:light-dark(#ccc,#555);--viz-series-1:light-dark(#245caf,#86b5ff);--viz-series-2:light-dark(#a95120,#f0ac7a);--viz-series-3:light-dark(#278059,#83cea6);--blue:var(--viz-series-1);--orange:var(--viz-series-2);--green:var(--viz-series-3);--purple:light-dark(#794db2,#c4a1f5);--red:light-dark(#b84155,#ffadba)}h3{font-size:17px;font-weight:500;margin:0 0 12px}.viz-row{display:flex;flex-wrap:wrap;gap:8px}.btn{font:inherit;color:inherit;background:var(--muted);border:1px solid var(--border);padding:8px 12px;border-radius:6px;cursor:pointer}.btn:focus-visible,input:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}.text-small{font-size:14px}.form-label{display:block}.form-range{display:block;width:100%;margin:18px 0}.tabular-nums{font-variant-numeric:tabular-nums}svg{max-width:100%}</style><body><div id="prime-patterns"><h3>Primes in a square spiral</h3><div class="viz-row"><button type="button" class="btn" id="prime-small">1–49, numbered</button><button type="button" class="btn" id="prime-large">1–6,561, primes only</button></div><svg role="img" aria-label="Integers arranged in an outward square spiral, with primes highlighted" style="width:100%;display:block"></svg><div class="text-small">Highlighted dots = primes. Center = 1. Numbers spiral outward.</div></div>
<script>
(()=>{const root=document.getElementById('prime-patterns'),svg=root.querySelector('svg');let size=7;function prime(n){if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true}function draw(){const w=root.clientWidth,h=Math.min(w,510),cell=(h-30)/size,NS='http://www.w3.org/2000/svg';svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();let x=0,y=0,dx=1,dy=0,len=1,steps=0,turns=0;for(let n=1;n<=size*size;n++){let p=prime(n),cx=w/2+x*cell,cy=h/2-y*cell;const mark=document.createElementNS(NS,'circle');mark.setAttribute('cx',cx);mark.setAttribute('cy',cy);mark.setAttribute('r',size===7?cell*.34:cell*.28);mark.setAttribute('fill',p?'var(--viz-series-1)':'var(--muted)');if(p||size===7)svg.append(mark);if(size===7){let t=document.createElementNS(NS,'text');t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');t.setAttribute('fill',p?'var(--background)':'var(--foreground)');t.style.fontSize='12px';t.textContent=n;svg.append(t)}x+=dx;y+=dy;steps++;if(steps===len){steps=0;[dx,dy]=[-dy,dx];turns++;if(turns%2===0)len++}}}root.querySelector('#prime-small').onclick=()=>{size=7;draw()};root.querySelector('#prime-large').onclick=()=>{size=81;draw()};new ResizeObserver(draw).observe(root);draw()})();
</script>
<script>const sendHeight=()=>parent.postMessage({type:'riemann-height',height:document.body.scrollHeight},'*');new ResizeObserver(sendHeight).observe(document.body);addEventListener('load',sendHeight);</script></body></html>
